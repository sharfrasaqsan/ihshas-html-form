<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="styles.css"
  </head>
  <body>
    <div class="head">
      <h2>Seminar Detiles Form</h2>
      <p>Please fill out this seminar form. thanks</p>

      <form>
        <label for="title">Title</label>
        <select id="title" name="title" required>
          <option value="">Please select option</option>
          <option value="Mr">Mr</option>
          <option value="Mrs">Mrs</option>
          <option value="Miss">Miss</option>
        </select>

        <label for="name">Name</label>
        <div class="row">
          <input
            type="text"
            name="first_name"
            placeholder="First Name"
            required
          />
          <input
            type="text"
            name="last_name"
            placeholder="Last Name"
            required
          />
        </div>

        <label for="email">E-mail</label>
        <input
          type="email"
          id="email"
          name="email"
          placeholder="ex: myname@gmail.com"
          required
        />
        <small>example@gmail.com</small>

        <label>Seminar Date & Time</label>
        <div class="row">
          <input type="date" name="date" required />
          <input type="time" name="time" required />
        </div>

        <label for="seminar">Choice of seminar</label>
        <select id="seminar" name="seminar" required>
          <option value="">Please select</option>
          <option value="tech">Technology</option>
          <option value="marketing">Marketing</option>
          <option value="design">Design</option>
        </select>

        <label>Optional Request</label>
        <div class="checkbox-group">
          <label
            ><input type="checkbox" /> Do ypu want unlimited coffee &
            tea?</label
          >
          <label><input type="checkbox" /> Do you want a 24 hour buffet?</label>
          <label
            ><input type="checkbox" /> Do you want the organization to find you
            an hotel?</label
          >
          <label
            ><input type="checkbox" /> Do you want us to pick you up from the
            airport?</label
          >
        </div>

        <label for="comments">Comments</label>
        <textarea id="comments" name="comments" rows="4"></textarea>

        <button type="submit">Submit</button>
      </form>
    </div>
  </body>
</html>
